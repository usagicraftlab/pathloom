[package]
name = "pathloom"
version = "0.1.0"
description = "Pathloom desktop toolpath workspace"
authors = ["USAGI Craft Lab."]
edition = "2021"

[lib]
name = "pathloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
digest_auth = "0.3.1"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.24"
